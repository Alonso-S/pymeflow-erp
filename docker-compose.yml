version: '3.8'

services:
  # Aplicación Laravel (PHP 8.2 FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pymeflow_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - pymeflow_network
    depends_on:
      - db

  # Servidor Web Nginx
  webserver:
    image: nginx:alpine
    container_name: pymeflow_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pymeflow_network
    depends_on:
      - app

  # Base de Datos MySQL 8.0
  db:
    image: mysql:8.0
    container_name: pymeflow_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pymeflow_erp
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: pymeflow
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - pymeflow_network

  # Administrador visual de BD phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pymeflow_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    networks:
      - pymeflow_network
    depends_on:
      - db

networks:
  pymeflow_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
